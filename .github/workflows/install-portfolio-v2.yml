name: Install XOTahsin Portfolio V2
on:
  push:
    branches: [main]
    paths:
      - ".portfolio-v2-part-*"
      - ".github/workflows/install-portfolio-v2.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Expand bundle and replace site
        shell: bash
        run: |
          set -euo pipefail
          cat .portfolio-v2-part-* > .portfolio-v2.bundle.b64
          base64 -d .portfolio-v2.bundle.b64 > .portfolio-v2.tar.xz
          tar -xJf .portfolio-v2.tar.xz -C .
          rm -f .portfolio-v2-part-* .portfolio-v2.bundle.b64 .portfolio-v2.tar.xz
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Install XOTahsin Portfolio V2"
            git push origin HEAD:main
          fi
